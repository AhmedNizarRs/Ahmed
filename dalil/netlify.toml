# Netlify settings for the DALIL investor page.
# The website is the "site" folder. There is no build step.
# Response headers (security and caching) are in site/_headers.
# Everything outside "site" (README, QR codes, screenshots, tools) is never published.
[build]
  publish = "site"

# Server-side code. submission-created runs automatically after every verified form sign-up.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
