<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DALIL · door clip film</title>
<style>
  @font-face { font-family: "Geist"; src: url("assets/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0B0C0E; --fg: #F2F1EC; --fg2: #C9CDD3; --accent: #FFC700; --glow: #8BF5B0; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #c { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .scrim-top { position: absolute; left: 0; top: 0; width: 1080px; height: 820px;
    background: linear-gradient(180deg, rgba(11,12,14,.82) 0%, rgba(11,12,14,.55) 45%, rgba(11,12,14,0) 100%); }
  .scrim-bot { position: absolute; left: 0; bottom: 0; width: 1080px; height: 520px;
    background: linear-gradient(0deg, rgba(11,12,14,.78) 0%, rgba(11,12,14,0) 100%); }
  .t { position: absolute; left: 84px; width: 912px; color: var(--fg); font-family: "Geist", sans-serif;
    letter-spacing: -0.02em; line-height: 1.04; opacity: 0; will-change: auto; margin: 0; }
  .hook { top: 300px; font-size: 104px; font-weight: 800; }
  .mid  { top: 300px; font-size: 72px; font-weight: 700; }
  .big  { top: 300px; font-size: 84px; font-weight: 800; }
  .list { font-size: 72px; font-weight: 700; }
  .small { font-size: 56px; font-weight: 500; color: var(--fg2); }
  .url { font-size: 48px; font-weight: 600; top: 1560px; }
  .url.end { font-size: 56px; }
  .acc { color: var(--accent); }
  .glow { color: var(--glow); }
  #logo { position: absolute; left: 84px; top: 150px; width: 300px; opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="scrim-top"></div>
<div class="scrim-bot"></div>
<img id="logo" src="assets/logo.svg" alt="DALIL">
<p class="t hook" id="hook">A door handle<br>you can read.</p>
<p class="t url" id="url0">dalil-team.com</p>
<p class="t mid" id="sign">The room sign<br>is on the wall.</p>
<p class="t mid" id="hand">Your hand is<br>on the handle.</p>
<p class="t big" id="clips"><span class="acc">DALIL</span> clips on.<br>No tools.</p>
<p class="t list" id="num" style="top:300px">Raised number</p>
<p class="t list" id="braille" style="top:386px">Braille</p>
<p class="t small" id="room" style="top:486px">Room 204</p>
<p class="t big" id="still">When the lights fail,<br><span class="glow">it still speaks.</span></p>
<p class="t big" id="tag" style="top:330px">Make the existing<br>path speak.</p>
<p class="t url end" id="url">dalil-team.com</p>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

/* ---------- Timeline: the single source of truth ---------- */
const TL = await (await fetch("timeline.json")).json();
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const B = (scene, beat) => SC[scene].beats[beat];
const TX = Object.fromEntries(TL.texts.map(x => [x.id, x]));
window.DUR = TL.meta.dur; window.FPS = TL.meta.fps; window.CUES = TL;

/* ---------- Math helpers (time is the only input) ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const v3 = (a) => new THREE.Vector3(...a);
const lerpV = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
// Closed-form damped spring from 0 to 1, starting at t0.
function spring(t, t0, zeta = 0.8, omega = 14) {
  const x = t - t0; if (x <= 0) return 0;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * omega * x) * (Math.cos(wd * x) + (zeta * omega / wd) * Math.sin(wd * x));
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Renderer ---------- */
const W = 1080, H = 1920;
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const FOG = new THREE.Color("#15110e");
scene.background = FOG.clone();
scene.fog = new THREE.Fog(FOG.clone(), 260, 1300);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, W / H, 1, 4000);

const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.0, 0.55, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- Procedural textures (generated once from a seed: they belong to the world) ---------- */
function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const tx = new THREE.CanvasTexture(cv); if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 8; return tx;
}
const rnd = mulberry32(204);
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = "#4a3828"; g.fillRect(0, 0, w, h);
  const plank = 64;
  for (let y = 0; y < h; y += plank) {
    let x = -rnd() * 400;
    while (x < w) {
      const len = 260 + rnd() * 360, l = 30 + rnd() * 12;
      g.fillStyle = `hsl(${24 + rnd() * 6},${34 + rnd() * 8}%,${l * 0.62}%)`; g.fillRect(x, y, len, plank);
      for (let k = 0; k < 10; k++) { g.fillStyle = `rgba(20,12,6,${0.05 + rnd() * 0.06})`; g.fillRect(x, y + rnd() * plank, len, 1 + rnd() * 2); }
      g.fillStyle = "rgba(10,6,3,.55)"; g.fillRect(x, y, 2, plank); x += len;
    }
    g.fillStyle = "rgba(10,6,3,.6)"; g.fillRect(0, y, w, 2);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(5, 5);
const wallTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#cbbca6"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const v = rnd(); g.fillStyle = `rgba(${v > .5 ? "255,250,240" : "70,55,40"},${0.03 + rnd() * 0.04})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping; wallTex.repeat.set(8, 2);
// Venetian blinds, projected by the key light.
const blindsTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  const grd = g.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w / 2);
  grd.addColorStop(0, "#fff"); grd.addColorStop(1, "#000");
  g.save(); g.translate(w / 2, h / 2); g.rotate(-0.32); g.translate(-w / 2, -h / 2);
  for (let y = -200; y < h + 200; y += 17) { g.fillStyle = grd; g.fillRect(-200, y, w + 400, 10); }
  g.restore();
});

/* ---------- Materials ---------- */
const M = {
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0 }),
  wall: new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.92 }),
  skirting: new THREE.MeshStandardMaterial({ color: "#2a221c", roughness: 0.6 }),
  door: new THREE.MeshStandardMaterial({ color: "#3f5a74", roughness: 0.42, metalness: 0.0 }),
  frame: new THREE.MeshStandardMaterial({ color: "#d8d1c4", roughness: 0.5 }),
  steel: new THREE.MeshStandardMaterial({ color: "#cfd3d8", roughness: 0.28, metalness: 1.0, envMapIntensity: 1.4 }),
  plaque: new THREE.MeshStandardMaterial({ color: "#2c2c2e", roughness: 0.5 }),
};
const clipMats = [];
function clipMaterial() {
  const m = new THREE.MeshStandardMaterial({ color: "#FFC700", roughness: 0.5, metalness: 0, emissive: new THREE.Color("#8BF5B0"), emissiveIntensity: 0 });
  clipMats.push(m); return m;
}

/* ---------- The world: a corridor wall with doors ---------- */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), M.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(3000, 320), M.wall);
wall.position.set(400, 160, 0); wall.receiveShadow = true; scene.add(wall);
const skirt = new THREE.Mesh(new THREE.BoxGeometry(3000, 10, 1.5), M.skirting);
skirt.position.set(400, 5, 0.75); scene.add(skirt);

const font = await new Promise(r => new FontLoader().load("./node_modules/three/examples/fonts/helvetiker_bold.typeface.json", r));

// Braille for "204": number sign ⠼ (3,4,5,6), b (1,2), j (2,4,5), d (1,4,5).
const BRAILLE_204 = [[3, 4, 5, 6], [1, 2], [2, 4, 5], [1, 4, 5]];
const DOT_POS = { 1: [0, 0], 2: [0, 1], 3: [0, 2], 4: [1, 0], 5: [1, 1], 6: [1, 2] };

const CLIP = { len: 6.6, h: 3.4, d: 2.8 };
function makeClip(animated) {
  const g = new THREE.Group();
  const mat = clipMaterial();
  const body = new THREE.Mesh(new RoundedBoxGeometry(CLIP.len, CLIP.h, CLIP.d, 4, 0.55), mat);
  body.castShadow = true; body.receiveShadow = true; g.add(body);
  // Seam rings at both ends, like the printed clip.
  for (const sx of [-1, 1]) {
    const ring = new THREE.Mesh(new RoundedBoxGeometry(0.35, CLIP.h + 0.25, CLIP.d + 0.25, 2, 0.12), mat);
    ring.position.x = sx * (CLIP.len / 2 - 0.35); ring.castShadow = true; g.add(ring);
  }
  // Raised numeral, lying on the top face.
  const tg = new TextGeometry("204", { font, size: 1.15, depth: 0.34, curveSegments: 5, bevelEnabled: false });
  tg.computeBoundingBox(); const bb = tg.boundingBox;
  tg.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, 0);
  const num = new THREE.Mesh(tg, mat); num.castShadow = true;
  const numPivot = new THREE.Group(); numPivot.position.set(-1.45, CLIP.h / 2 - 0.02, 0.05);
  num.rotation.x = -Math.PI / 2; numPivot.add(num); g.add(numPivot);
  // Braille cells.
  const dotGeo = new THREE.SphereGeometry(0.15, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  const cells = BRAILLE_204.map((dots, ci) => {
    const cell = new THREE.Group(); cell.position.y = CLIP.h / 2 - 0.01;
    dots.forEach(d => {
      const [c, r] = DOT_POS[d];
      const m = new THREE.Mesh(dotGeo, mat);
      m.position.set(0.62 + ci * 0.62 + c * 0.25, 0, -0.25 + r * 0.25);
      m.castShadow = true; cell.add(m);
    });
    g.add(cell); return cell;
  });
  return { group: g, mat, numPivot, cells, animated };
}

function makeDoor(x, withClip) {
  const g = new THREE.Group(); g.position.x = x;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(90, 210, 4), M.door);
  slab.position.set(0, 105, 1.2); slab.castShadow = true; slab.receiveShadow = true; g.add(slab);
  const fw = 7;
  for (const [w, h, px, py] of [[fw, 217, -45 - fw / 2, 108.5], [fw, 217, 45 + fw / 2, 108.5], [90 + 2 * fw, fw, 0, 210 + fw / 2]]) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 5.5), M.frame);
    f.position.set(px, py, 2.0); f.castShadow = true; f.receiveShadow = true; g.add(f);
  }
  // Lever handle: rose, neck, bar pointing toward the hinge side.
  const rose = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 1.2, 40), M.steel);
  rose.rotation.x = Math.PI / 2; rose.position.set(35, 105, 3.8); rose.castShadow = true; g.add(rose);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.1, 5.6, 28), M.steel);
  neck.rotation.x = Math.PI / 2; neck.position.set(35, 105, 7.0); neck.castShadow = true; g.add(neck);
  const bar = new THREE.Mesh(new RoundedBoxGeometry(14, 2.2, 1.7, 3, 0.7), M.steel);
  bar.position.set(35 - 6.2, 105, 9.8); bar.castShadow = true; g.add(bar);
  // Wall sign beside the door.
  const signTex = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = "#2c2c2e"; c.fillRect(0, 0, w, h);
    c.fillStyle = "#e8e6df"; c.font = "bold 92px Helvetica, Arial, sans-serif"; c.textAlign = "center"; c.fillText("204", w / 2, 128);
    c.font = "600 30px Helvetica, Arial, sans-serif"; c.fillText("ROOM", w / 2, 50);
    BRAILLE_204.forEach((dots, ci) => dots.forEach(d => { const [cc, r] = DOT_POS[d];
      c.beginPath(); c.arc(70 + ci * 36 + cc * 13, 170 + r * 13, 4.5, 0, Math.PI * 2); c.fill(); }));
  });
  const plaque = new THREE.Mesh(new THREE.BoxGeometry(16, 16, 0.6), [M.plaque, M.plaque, M.plaque, M.plaque,
    new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.45 }), M.plaque]);
  plaque.position.set(75, 150, 0.3); plaque.castShadow = true; g.add(plaque);
  scene.add(g);
  let clip = null;
  if (withClip) { clip = makeClip(x === 0); clip.home = new THREE.Vector3(x + 25.2, 105, 9.8); clip.group.position.copy(clip.home); scene.add(clip.group); }
  return { g, clip };
}
const DOOR_X = [0, 230, 460, 690, 920, 1150];
const doors = DOOR_X.map(x => makeDoor(x, true));
const hero = doors[0].clip;

/* ---------- Lights ---------- */
const amb = new THREE.HemisphereLight("#ffe2c4", "#24170e", 0.14); scene.add(amb);
const key = new THREE.SpotLight("#ffae5e", 12.0, 0, 0.42, 0.5, 0);
key.position.set(-260, 250, 330); key.target.position.set(40, 115, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
key.shadow.camera.near = 100; key.shadow.camera.far = 1200; key.map = blindsTex;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight("#ffd9b0", 0.15); fill.position.set(200, 300, 400); scene.add(fill);
const macro = new THREE.DirectionalLight("#ffc98a", 0.0);
macro.position.set(hero.home.x - 34, hero.home.y + 16, hero.home.z + 12); macro.target.position.copy(hero.home);
macro.castShadow = true; macro.shadow.mapSize.set(2048, 2048); macro.shadow.bias = -0.0002; macro.shadow.normalBias = 0.005;
Object.assign(macro.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 80 });
scene.add(macro, macro.target);
const moon = new THREE.DirectionalLight("#7f9bc4", 0.0); moon.position.set(500, 260, 300); scene.add(moon);
const glowLights = doors.map(d => { const p = new THREE.PointLight("#8BF5B0", 0, 60, 1.5); p.position.copy(d.clip.home).add(new THREE.Vector3(0, 2, 12)); scene.add(p); return p; });

/* ---------- Camera path (keys in cm, eased per segment; two hard cuts) ---------- */
const C0 = hero.home;
const camKeys = [
  // [tFrom, tTo, posFrom, posTo, lookFrom, lookTo, fovFrom, fovTo, ease]
  [0, SC.hook.end, [88, 124, 168], [76, 120, 140], [22, 109, 0], [23, 108, 0], 38, 38, k => k],
  [SC.problem.start, B("problem", "pan"), [92, 153, 64], [88, 152, 58], [75, 150, 0], [75, 150, 0], 34, 34, k => k],
  [B("problem", "pan"), B("problem", "handle"), [88, 152, 58], [42, 117, 46], [75, 150, 0], [26, 106, 9], 34, 36, eIO],
  [B("problem", "handle"), SC.problem.end, [42, 117, 46], [36, 117, 56], [26, 106, 9], [20, 106.5, 9], 36, 36, eIO],
  [SC.clip.start, B("clip", "orbit"), [36, 117, 56], [36, 117, 56], [20, 106.5, 9], [20, 106.5, 9], 36, 36, k => k],
  [B("clip", "orbit"), SC.clip.end, [36, 117, 56], [33, 123, 38], [20, 106.5, 9], [24, 106.5, 9.5], 36, 36, eIO],
  [SC.read.start, SC.dark.end, [25.2, 133, 19.5], [25.2, 130.5, 18.2], [25.2, 107.9, 9.6], [25.2, 107.8, 9.6], 34, 34, k => k],
  [SC.glow.start, SC.glow.end, [60, 121, 72], [54, 119, 62], [27, 108, 6], [27, 108, 6], 36, 36, k => k],
  [SC.end.start, B("end", "card") + 1.4, [54, 119, 62], [-170, 150, 255], [27, 108, 6], [260, 108, 0], 36, 40, eIO],
  [B("end", "card") + 1.4, TL.meta.dur + 1, [-170, 150, 255], [-170, 150, 255], [260, 108, 0], [260, 108, 0], 40, 40, k => k],
];
function cameraAt(t) {
  let k = camKeys[0];
  for (const c of camKeys) if (t >= c[0]) k = c;
  const p = k[8](prog(t, k[0], k[1]));
  camera.position.set(...lerpV(k[2], k[3], p));
  camera.fov = lerp(k[6], k[7], p);
  // Beat punch on the snap: 1.5% scale, decaying.
  const ds = t - B("clip", "snap"); if (ds > 0 && ds < 0.6) camera.fov *= 1 - 0.015 * Math.exp(-9 * ds);
  camera.updateProjectionMatrix();
  camera.lookAt(...lerpV(k[4], k[5], p));
}

/* ---------- Text: one read at a time, enter 0.4 s ease-out, exit 0.2 s ease-in ---------- */
const textEls = Object.fromEntries(TL.texts.map(x => [x.id, document.getElementById(x.id)]));
function textAt(t) {
  for (const x of TL.texts) {
    const el = textEls[x.id]; if (!el) continue;
    const enterAt = x.from <= 0.01 ? -1 : x.from - 0.4;
    const kin = eOut(prog(t, enterAt, x.from));
    const kout = eIn(prog(t, x.to, x.to + 0.2));
    el.style.opacity = (kin * (1 - kout)).toFixed(3);
    el.style.transform = `translateY(${((1 - kin) * 28).toFixed(1)}px)`;
  }
  const logoK = t < SC.hook.end ? 1 - eIn(prog(t, TX.hook.to, TX.hook.to + 0.2)) : eOut(prog(t, B("end", "card") - 0.4, B("end", "card")));
  document.getElementById("logo").style.opacity = logoK.toFixed(3);
}

/* ---------- The film: every property is a function of t ---------- */
function render(t) {
  cameraAt(t);
  // Light level: full until the turn, then out in 0.18 s.
  const out = B("dark", "out");
  const day = 1 - eIn(prog(t, out, out + 0.18));
  key.intensity = 12.0 * day; amb.intensity = 0.14 * day + 0.012; fill.intensity = 0.15 * day;
  scene.environmentIntensity = 0.35 * day + 0.02;
  macro.intensity = 2.2 * day * clamp(prog(t, SC.read.start - 0.01, SC.read.start) );
  moon.intensity = 0.38 * (1 - day);
  const fogCol = FOG.clone().multiplyScalar(0.25 + 0.75 * day);
  scene.fog.color.copy(fogCol); scene.background.copy(fogCol);

  // Glow: the hero clip springs up at the payoff; every other door is already glowing in the corridor.
  const heroT = B("glow", "hero");
  const g0 = clamp(spring(t, heroT, 0.85, 7), 0, 1.15);
  doors.forEach((d, i) => {
    const c = d.clip;
    const glowK = i === 0 ? g0 : (t > out + 0.2 ? 1 : 0);
    c.group.visible = i === 0 ? t >= SC.clip.start : t > out + 0.2;
    c.mat.emissiveIntensity = 0.5 * glowK;
    glowLights[i].intensity = 70 * glowK;
  });
  bloom.strength = 0.55 * clamp(g0);
  bloom.threshold = 0.35; bloom.radius = 0.35;

  // Hero clip: slide in, anticipate, snap with one overshoot and a small squash.
  const hc = hero.group;
  const tA = SC.clip.start, tB = B("clip", "anticipate"), tS = B("clip", "snap");
  const pStart = [-36, 9, 16], pNear = [-9.5, 0.7, 0], pBack = [-10.8, 0.9, 0];
  let off;
  if (t < tB) { const k = eOut(prog(t, tA, tB)); off = lerpV(pStart, pNear, k);
    hc.rotation.set(lerp(0.7, 0, k), lerp(-0.9, 0, k), lerp(0.35, 0, k)); }
  else if (t < tS - 0.12) { const k = eIO(prog(t, tB, tS - 0.12)); off = lerpV(pNear, pBack, k); hc.rotation.set(0, 0, 0); }
  else if (t < tS) { const k = eIn(prog(t, tS - 0.12, tS)); off = lerpV(pBack, [0, 0, 0], k); hc.rotation.set(0, 0, 0); }
  else { const x = t - tS; const wd = 26; off = [0.45 * Math.exp(-6 * x) * Math.sin(wd * x), 0, 0]; hc.rotation.set(0, 0, 0); }
  hc.position.set(C0.x + off[0], C0.y + off[1], C0.z + off[2]);
  const sq = t >= tS ? 1 - 0.07 * Math.exp(-10 * (t - tS)) * Math.cos(22 * (t - tS)) : 1;
  hc.scale.set(sq, 1 / Math.sqrt(sq), 1 / Math.sqrt(sq));

  // Raised number rises, then braille cells rise one per beat. Other doors show them finished.
  doors.forEach((d, i) => {
    const c = d.clip;
    const nk = i === 0 ? clamp(spring(t, B("read", "numeral"), 0.75, 16), 0.001, 1.2) : 1;
    c.numPivot.scale.set(1, nk, 1);
    c.cells.forEach((cell, ci) => {
      const ck = i === 0 ? clamp(spring(t, B("read", "cell" + (ci + 1)), 0.7, 20), 0.001, 1.25) : 1;
      cell.scale.set(1, ck, 1);
    });
  });

  textAt(t);
  composer.render();
}

window.seek = async (t) => { render(t); };
window.READY = (async () => { await document.fonts.ready; await document.getElementById("logo").decode().catch(() => {}); render(0); })();
</script>
</body>
