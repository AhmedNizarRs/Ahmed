name: Vigil API probe

on:
  push:
    paths:
      - ".github/workflows/vigil-api-probe.yml"

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Dump AlarmKit API from the iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find "$SDK/System/Library/Frameworks/AlarmKit.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "$F"
          grep -v -E "^\s*$|^//|@_alwaysEmitIntoClient|@inlinable|_semantics" "$F" | grep -v -E "^\s*(get|set|_read|_modify)\s*$" | cut -c1-230 | head -400
          echo ----- AlertSound
          for f in $(find "$SDK/System/Library/Frameworks/ActivityKit.framework" -name "arm64e-apple-ios.swiftinterface"); do
            grep -n -E "AlertSound|struct AlertConfiguration|static func named|case named|static var default" "$f" | cut -c1-200
          done
