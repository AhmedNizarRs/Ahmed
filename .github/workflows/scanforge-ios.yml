name: ScanForge iOS

on:
  push:
    paths:
      - "scanforge/**"
      - ".github/workflows/scanforge-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: scanforge
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test STL pipeline
        run: |
          xcrun --sdk macosx swiftc -O ScanForge/Export/PrintMesh.swift Tests/main.swift -o "$RUNNER_TEMP/meshtests"
          "$RUNNER_TEMP/meshtests"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ScanForge.xcodeproj \
            -target ScanForge \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/ScanForge.app
          plutil -p build/Release-iphoneos/ScanForge.app/Info.plist

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ScanForge.app Payload/
          zip -qry ScanForge-unsigned.ipa Payload
          ls -lh ScanForge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScanForge-unsigned-ipa
          path: scanforge/ScanForge-unsigned.ipa
          if-no-files-found: error
