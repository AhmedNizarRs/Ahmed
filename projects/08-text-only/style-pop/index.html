    <script>
      const tl = gsap.timeline({ paused: true });
      const SCENE = 2.5;
      document.querySelectorAll(".scene").forEach((sc, i) => {
        const t0 = i * SCENE, card = sc.querySelector(".card");
        tl.fromTo(card, { scale: 0, rotation: -14 }, { scale: 1, rotation: -2, duration: 0.55, ease: "back.out(2.5)" }, t0);
        tl.fromTo(sc.querySelectorAll(".row > .w"), { scale: 0, y: 30 }, { scale: 1, y: 0, duration: 0.45, ease: "back.out(2.5)", stagger: 0.08 }, t0 + 0.2);
        const chip = sc.querySelector(".chip");
        if (chip) tl.to(chip, { rotation: 2, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut" }, t0 + 0.9);
        tl.fromTo(sc.querySelectorAll(".stk"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.5)", stagger: 0.07 }, t0 + 0.05);
        sc.querySelectorAll(".stk").forEach((s) => { const d = +s.dataset.d; if (d) tl.to(s, { rotation: d * 140, transformOrigin: "50% 50%", duration: SCENE, ease: "none" }, t0);
          else tl.to(s, { y: -18, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 0.5); });
        tl.to(card, { scale: 0.9, rotation: 4, opacity: 0, duration: 0.25, ease: "back.in(2)" }, t0 + SCENE - 0.27);
      });
      window.__timelines["main"] = tl;
