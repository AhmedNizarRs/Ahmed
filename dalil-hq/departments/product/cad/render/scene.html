<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F2F1EC;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeVertices, toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';

const q = new URLSearchParams(location.search);
const sceneName = q.get('scene');
const W = +q.get('w') || 1800, H = +q.get('h') || 1200;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
const env = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = env;

const loader = new STLLoader();
const DARK = new THREE.Color(0x14161a);
// mode 'flat' height = z ; mode 'rail' height = distance from rail axis minus radius (axis at y=0, z=-R)
const load = (url, opts={}) => new Promise(res => loader.load(url, g0 => {
  let g = toCreasedNormals(mergeVertices(g0, 1e-4), Math.PI/6);
  if (opts.colour) {
    const p = g.attributes.position, n = p.count, col = new Float32Array(n*3), base = new THREE.Color(opts.base), R = opts.R || 0;
    const sm = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
    for (let i=0;i<n;i++){ const y=p.getY(i), z=p.getZ(i); const h = opts.mode==='rail' ? Math.hypot(y, z+R)-R : z;
      const t = sm(0.5, 0.56, h); const c = base.clone().lerp(opts.top || DARK, t); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
  }
  res(g); }));
const YELLOW = 0xFFC700, GLOW = 0x8BF5B0;
const hmat = (o) => { const m = new THREE.MeshStandardMaterial({roughness:o.r ?? 0.5, metalness:0, emissive: o.glow ? 0xffffff : 0x000000, emissiveIntensity:o.ei ?? 1});
  m.onBeforeCompile = sh => { sh.uniforms.uBase={value:new THREE.Color(o.base)}; sh.uniforms.uTop={value:new THREE.Color(o.top ?? 0x14161a)};
    const hexpr = o.mode==='rail' ? `length(vec2(position.y, position.z + ${o.R.toFixed(3)})) - ${o.R.toFixed(3)}` : 'position.z';
    sh.vertexShader = 'varying float vH;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vH = ' + hexpr + ';');
    sh.fragmentShader = 'varying float vH; uniform vec3 uBase; uniform vec3 uTop;\n' + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb = mix(uBase, uTop, smoothstep(0.505, 0.52, vH));').replace('vec3 totalEmissiveRadiance = emissive;', 'vec3 totalEmissiveRadiance = emissive * mix(uBase, uTop, smoothstep(0.505, 0.52, vH));'); };
  return m; };
const vmat_unused = (r=0.5) => new THREE.MeshStandardMaterial({vertexColors:true, metalness:0, roughness:r});
const stainless = (c=0xc4c8cc) => new THREE.MeshStandardMaterial({color:c, metalness:1, roughness:0.32});
const matte = (c, r=0.55) => new THREE.MeshStandardMaterial({color:c, metalness:0, roughness:r});
function mesh(g, m){ const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; return o; }
function sun(x,y,z,i,shadowSize=70){ const l = new THREE.DirectionalLight(0xffffff,i); l.position.set(x,y,z); l.castShadow = true;
  l.shadow.mapSize.set(4096,4096); const c=l.shadow.camera; c.left=-shadowSize;c.right=shadowSize;c.top=shadowSize;c.bottom=-shadowSize;c.near=1;c.far=400; l.shadow.bias=-0.0002; l.shadow.normalBias=0.02; scene.add(l); return l; }
const cam = (fov, pos, look, up=[0,0,1]) => { const c = new THREE.PerspectiveCamera(fov, W/H, 0.5, 1000); c.up.set(...up); c.position.set(...pos); c.lookAt(...look); return c; };

let camera, composer = null;



if (sceneName === 'hero') {
  scene.background = new THREE.Color(0xF2F1EC); scene.environmentIntensity = 0.8;
  const [rail, strip] = await Promise.all([load('stl/preview-only_rail-d32.stl'), load('stl/dalil-sticker-A-braille-number_on-rail-d32.stl')]);
  scene.add(mesh(rail, stainless())); scene.add(mesh(strip, hmat({base:YELLOW, mode:'rail', R:16})));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.ShadowMaterial({opacity:0.2})); ground.position.z = -33; ground.receiveShadow = true; scene.add(ground);
  sun(-50,-70,100,2.0,90); camera = cam(24, [-86,-160,94], [0,0,-3]);
}
else if (sceneName === 'macro') {
  scene.background = new THREE.Color(0xEDEBE4); scene.environmentIntensity = 0.5;
  const [rail, strip] = await Promise.all([load('stl/preview-only_rail-d32.stl'), load('stl/dalil-sticker-A-braille-number_on-rail-d32.stl')]);
  scene.add(mesh(rail, stainless(0xb9bdc1))); scene.add(mesh(strip, hmat({base:YELLOW, mode:'rail', R:16})));
  sun(-60,-34,26,2.8,45); camera = cam(20, [-2,-46,24], [19,0,0.4]);
}
else if (sceneName === 'glow') {
  scene.background = new THREE.Color(0x0B0C0E); scene.environmentIntensity = 0.04;
  const [rail, strip] = await Promise.all([load('stl/preview-only_rail-d32.stl'), load('stl/dalil-sticker-A-braille-number_on-rail-d32.stl')]);
  scene.add(mesh(rail, new THREE.MeshStandardMaterial({color:0x1b1d20, metalness:1, roughness:0.5})));
  scene.add(mesh(strip, hmat({base:GLOW, top:0x030504, mode:'rail', R:16, r:0.6, glow:true, ei:0.7})));
  const fill = new THREE.PointLight(GLOW, 6, 200, 2); fill.position.set(0,-30,40); scene.add(fill);
  camera = cam(24, [-86,-160,94], [0,0,-3]);
  composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W,H), 0.35, 0.6, 0.5)); composer.addPass(new OutputPass());
}
else if (sceneName === 'lever') {
  // ILLUSTRATION: lever bar diameter 19 mm is an assumption, not a measured door. Lever axis along x, bar centre at z=-9.5, sticker on top (z=0).
  scene.background = new THREE.Color(0xF2F1EC); scene.environmentIntensity = 0.9;
  const strip = await load('stl/B_on-lever-d19.stl');
  const steel = stainless(0xcfd2d6);
  const add = (geo, mat, pos, rot=[0,0,0]) => { const o = new THREE.Mesh(geo, mat); o.position.set(...pos); o.rotation.set(...rot); o.castShadow = o.receiveShadow = true; scene.add(o); return o; };
  add(new THREE.BoxGeometry(300, 44, 260), matte(0xC9C7BF, 0.85), [0, 62, 0]);                 // door leaf, face at y=40
  add(new THREE.CylinderGeometry(26,26,7,96), steel, [-70, 36.5, -9.5], [Math.PI/2,0,0]);      // rose
  add(new THREE.CylinderGeometry(9.5,9.5,40,64), steel, [-70, 20, -9.5], [Math.PI/2,0,0]);     // neck
  add(new THREE.CylinderGeometry(9.5,9.5,150,96), steel, [5, 0, -9.5], [0,0,Math.PI/2]);       // lever bar along x
  add(new THREE.SphereGeometry(9.5,48,32), steel, [80, 0, -9.5]);                               // rounded end
  scene.add(mesh(strip, hmat({base:YELLOW, mode:'rail', R:9.5})));
  sun(-90,-140,150,2.3,190); camera = cam(22, [-70,-215,105], [8,8,-8]);
}
else if (sceneName === 'plates') {
  scene.background = new THREE.Color(0xF2F1EC); scene.environmentIntensity = 0.7;
  const F = {};
  const [a, b, c] = await Promise.all([load('stl/dalil-sticker-A-braille-number_flat.stl',F), load('stl/dalil-sticker-B-braille-only_flat.stl',F), load('stl/dalil-calibration-dot-heights_0.4-0.5-0.6_flat.stl',F)]);
  const A = mesh(a, hmat({base:YELLOW, mode:'flat'})); A.position.set(-22, 36, 0);
  const B = mesh(b, hmat({base:YELLOW, mode:'flat'})); B.position.set(-22, 0, 0);
  const C = mesh(c, hmat({base:YELLOW, mode:'flat'})); C.position.set(58, 18, 0);
  scene.add(A,B,C);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(600,400), matte(0xE4E2DA, 0.9)); table.position.z = -0.01; table.receiveShadow = true; scene.add(table);
  sun(-50,-70,120,2.0,120); camera = cam(22, [12,-120,300], [14,16,0]);
}
else { throw new Error('unknown scene'); }

if (composer) composer.render(); else renderer.render(scene, camera);
window.__done = true;
</script></body></html>
